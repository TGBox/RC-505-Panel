[project]
name = "rc-505-panel"
version = "0.2.0"
description = "A GUI Panel for controlling the RC-505 Loopstation by BOSS."
readme = "README.md"
authors = [
    { name = "Daniel Rösch", email = "droesch91@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["mido", "python-rtmidi", "sounddevice", "soundfile", "numpy", "scipy", "PySide6"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
rc-505-panel = "rc_505_panel:main"

[project.gui-scripts]
rc-505-panel-gui = "rc_505_panel.ui.app:run"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
